    <script type="module">
      import { JustifiedGallery } from "@/justified-gallery";
      import { EventType } from "@/events";

      window.jgCompletedCount = 0;
      window.jgTriggerEvent = (name) => {
        if (name === EventType.Complete) window.jgCompletedCount++;
      };
      new JustifiedGallery(document.getElementById("margin0"), {
        margins: 0,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin1"), {
        margins: 1,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin10"), {
        margins: 10,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin20"), {
        margins: 20,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin20border0"), {
        margins: 20, border: 0,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin20border5"), {
        margins: 20, border: 5,
        triggerEvent: window.jgTriggerEvent,
      }).init();
      new JustifiedGallery(document.getElementById("margin0border20"), {
        margins: 0, border: 20,
        triggerEvent: window.jgTriggerEvent,
      }).init();
    </script>
