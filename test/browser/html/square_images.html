<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app">
      <h1>Square Images Test</h1>

      <div id="gallery">
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
        <a href="../imgs/BxsII_1_1.jpg" title="title BxsII_1_1">
          <img src="../imgs/BxsII_1_1_m.jpg" alt="BxsII_1_1" />
        </a>
      </div>
    </div>

    <script type="module">
      import { JustifiedGallery } from "@/justified-gallery";
      import { EventType } from "@/events";

      window.jgCompletedCount = 0;
      window.jgTriggerEvent = (name) => {
        if (name === EventType.Complete) window.jgCompletedCount++;
      };

      new JustifiedGallery(document.getElementById("gallery"), {
        rowHeight: 120,
        lastRow: "nojustify",
        justifyThreshold: 0.5,
        triggerEvent: window.jgTriggerEvent,
      }).init();
    </script>
  </body>
</html>
