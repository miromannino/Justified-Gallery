    <script type="module">
      import { JustifiedGallery } from "@/justified-gallery";
      import { EventType } from "@/events";

      window.jgCompletedCount = 0;
      window.jgTriggerEvent = (name) => {
        if (name === EventType.Complete) window.jgCompletedCount++;
      };

      new JustifiedGallery(document.getElementById("justifyLastRow"), {
        lastRow: "justify",
        rowHeight: 50,
        maxRowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();

      new JustifiedGallery(document.getElementById("nojustifyLastRow"), {
        lastRow: "nojustify",
        rowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();

      new JustifiedGallery(document.getElementById("leftLastRow"), {
        lastRow: "left",
        rowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();

      new JustifiedGallery(document.getElementById("centerLastRow"), {
        lastRow: "center",
        rowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();

      new JustifiedGallery(document.getElementById("rightLastRow"), {
        lastRow: "right",
        rowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();

      new JustifiedGallery(document.getElementById("hideLastRow"), {
        lastRow: "hide",
        rowHeight: 50,
        triggerEvent: window.jgTriggerEvent,
      }).init();
    </script>
